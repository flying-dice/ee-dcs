name: Deploy web app to GitHub Pages

# Replaces Cloudflare Pages. The Pages source is set to "GitHub Actions" in
# Settings > Pages, so this workflow is the only thing that publishes the site.
#
# The app is a static Vite/Svelte build. vite.config.js already sets `base: './'`,
# so the bundle works from the project-pages subpath (flying-dice.github.io/ee-dcs/)
# without a base-path override here.

on:
  push:
    branches: [main]
    # Only rebuild when something the site actually contains changes.
    paths:
      - "apps/web/**"
      - "packages/ee-mission/**"
      - "dist/ee-dcs.lua"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build the campaign bundle from TypeScript source rather than trusting the
      # committed dist/ee-dcs.lua. apps/web's `prebuild` copies that file into the
      # site, so building it here guarantees the deployed page ships the campaign
      # that matches this commit instead of a stale artifact.
      - name: Build campaign bundle
        run: npm run build --workspace ee-mission

      # Fail loudly instead of deploying a broken site.
      #
      # The app needs TWO theatre asset sets, loaded by different mechanisms:
      #
      #   1. apps/web/src/theatres/<Id>.geojson  - BUILD time. terrains.ts:24 globs
      #      `../theatres/*.geojson`. An empty dir still BUILDS (the glob matches
      #      nothing); the app just has no theatres.
      #   2. apps/web/public/osm/<Id>.geojson.gz - RUN time. osm.ts:11 fetches
      #      `${BASE_URL}osm/<Id>.geojson.gz` and gunzips it client-side. Vite copies
      #      public/ verbatim, so a missing file is a 404 only when a theatre is
      #      selected - long after the pipeline has gone green.
      #
      # Either way the build SUCCEEDS and the site deploys broken. A green pipeline
      # publishing a broken page is the worst failure mode available, so check that
      # both are committed. They are a paired export contract (docs/bots/NOTES.md):
      # theatres from the DCS export, osm from the Docker/Osmium export.
      - name: Verify theatre assets are committed
        run: |
          missing=0
          check() {
            count=$(git ls-files "$1" | grep -c "$2\$" || true)
            echo "$1: $count committed file(s) matching *$2"
            [ "$count" -eq 0 ] && missing=1
            return 0
          }
          check apps/web/src/theatres '.geojson'
          check apps/web/public/osm '.geojson.gz'
          if [ "$missing" -eq 1 ]; then
            echo "::error::A theatre asset set has no committed files. The site would build and deploy, then fail at runtime on theatre selection. Commit the paired export (docs/bots/NOTES.md)."
            exit 1
          fi

      - name: Build site
        run: npm run build --workspace dcs-eech-mapgen

      # public/ is copied verbatim by Vite, so confirm the runtime asset actually
      # reached the artifact rather than trusting that it was in the source tree.
      - name: Verify runtime assets reached the build output
        run: |
          if ! ls apps/web/dist/osm/*.geojson.gz >/dev/null 2>&1; then
            echo "::error::No osm/*.geojson.gz in apps/web/dist. The deployed site would 404 on theatre load."
            exit 1
          fi
          ls -la apps/web/dist/osm/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
